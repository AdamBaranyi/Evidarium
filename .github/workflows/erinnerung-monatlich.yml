name: Erinnerung monatlich

# Für die Handgriffe, die niemand meldet, weil sie auf dem Server passieren
# und nicht im Repository: Container-Images erneuern, Sicherung ansehen,
# Ausnahmen nachprüfen.
#
# Ohne diesen Lauf hängt die monatliche Wartung allein am Gedächtnis, und
# genau das ist die Stelle, an der ein Sicherheitssystem im Alltag stirbt.

on:
  schedule:
    # Am Ersten jedes Monats, 07:05 UTC.
    - cron: '5 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  erinnern:
    name: Wartungsliste öffnen
    runs-on: ubuntu-24.04
    steps:
      - name: Issue anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          monat=$(date +'%m.%Y')

          gh label create wartung --repo "$REPO" --color 0E8A16 \
            --description "Wiederkehrende Wartung" 2>/dev/null || true

          gh issue create --repo "$REPO" \
            --title "Monatliche Wartung $monat" \
            --label wartung \
            --assignee AdamBaranyi \
            --body "$(cat <<'EOF'
          Rund 15 Minuten. Der Reihe nach:

          - [ ] **Abbilder erneuern** — Tunnel einschalten, dann
                `ssh -t vps1 'sudo /opt/evidarium/infra/deploy.sh'`. Das Ausrollen zieht
                `pgvector/pgvector` und die Basis-Abbilder frisch, auch ohne neuen Commit.
                Warum das sein muss: Der Server pflegt sich selbst, Container nicht. Und
                die Abbilder werden unter derselben Nummer neu gebaut — auf neue
                Versionsnummern zu warten bringt hier nichts.
          - [ ] **Sicherung zurückspielen proben** —
                `ssh -t vps1 'sudo /opt/evidarium/infra/sicherung-pruefen.sh'`. Lädt die
                neueste nächtliche Sicherung in eine eigene Probe-Datenbank, zählt und
                räumt auf. Eine Sicherung, aus der nie etwas zurückgespielt wurde, ist eine
                Vermutung.
          - [ ] **Guthaben** — Restguthaben in der Konsole von Anthropic. Ist es leer,
                antwortet Evidarium nicht mehr (docs/BETRIEB.md, «Monatlich»).
          - [ ] **Offene Pull Requests** hier und in
                [Signature-Style](https://github.com/AdamBaranyi/Signature-Style/pulls):
                grüne mergen. Das hält nebenbei die geplanten Läufe am Leben — GitHub schaltet
                sie in öffentlichen Repositories nach 60 Tagen ohne Aktivität ab.
          - [ ] **Serverupdates** — `ssh vps1 'apt list --upgradable'`. Liegt etwas länger als
                ein paar Tage, nachfassen statt auf unattended-upgrades warten.
          - [ ] **Ausnahmen nachprüfen** — jede Ausnahme in `scripts/audit.sh` und
                `docs/SECURITY.md`, deren «prüfen bis» in diesem Monat liegt: Gibt es ein
                Update, ist der Befund weg? Sonst neu bewerten und höchstens einen Monat
                verlängern. Dazu das Issue «Sicherheitsmeldungen» ansehen, falls eines offen ist.

          Alle drei Monate zusätzlich:

          - [ ] **Header von aussen prüfen** — securityheaders.com oder ein eigener Durchgang.

          Erledigt? Issue schliessen. Am Ersten des nächsten Monats kommt das nächste.
          EOF
          )"
