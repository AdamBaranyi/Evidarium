name: Sicherheit täglich

# Der volle CI-Lauf hängt an Push und Pull Request. Ohne Commit entsteht damit
# eine Lücke: Ein Paket, das heute sauber ist, kann morgen eine Meldung haben,
# und ein Geheimnis in einem alten Commit bleibt unbemerkt, solange niemand
# etwas schiebt. Darum läuft diese Prüfung jeden Tag von selbst.
#
# Sie ist bewusst schmal — nur Secret-Scan und Abhängigkeiten, keine Builds,
# keine Browser-Tests. Ein täglicher Lauf, der zwanzig Minuten braucht, wird
# abgeschaltet; einer, der zwei Minuten braucht, bleibt.
#
# Rot wird der Lauf nur bei einem Geheimnis (gitleaks), einem echten Notfall,
# oder wenn der Audit selbst scheitert. Befunde in Abhängigkeiten färben ihn
# nicht: Ein roter geplanter Lauf schickt jeden Tag eine Mail und hängt ein
# rotes Kreuz an den letzten Commit auf main. Sie kommen stattdessen in die
# Laufzusammenfassung und in ein einziges Issue «Sicherheitsmeldungen», das
# sich nur meldet, wenn sich die Liste der Kennungen ändert. Geurteilt wird in
# ci.yml auf Push und Pull Request, ab «high». Regel vom 10.10.2026, siehe
# docs/SECURITY.md.
#
# Wer die Meldung bekommt: das Issue ist Adam zugewiesen. Einen gescheiterten
# geplanten Lauf meldet GitHub der Person, die die cron-Zeile zuletzt geändert
# hat.
#
# Öffentliche Repositories: GitHub schaltet geplante Workflows nach 60 Tagen
# ohne Repository-Aktivität ab. Regelmässig gemergte Update-PRs halten den
# Zeitplan am Leben.

on:
  schedule:
    # 06:17 UTC — in Zürich 08:17 im Sommer, 07:17 im Winter. Nicht zur vollen
    # Stunde, weil GitHub dann am meisten Last hat und Läufe sich verspäten.
    - cron: '17 6 * * *'
  workflow_dispatch:

# Lesen, dazu Issues schreiben für die eine Meldung. Sonst keine Rechte.
permissions:
  contents: read
  issues: write

concurrency:
  group: sicherheit-taeglich
  cancel-in-progress: false

jobs:
  pruefung:
    name: Secret-Scan und Abhängigkeiten
    runs-on: ubuntu-24.04
    steps:
      # Die ganze Historie, nicht nur der letzte Stand: ein Geheimnis, das in
      # einem alten Commit steht, ist im öffentlichen Repository weiter lesbar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Hält fest, dass wirklich die ganze Historie da ist. Ein flacher Checkout
      # hätte genau einen Commit, und der Scan sähe grün aus, ohne es zu sein.
      - name: Historie vollständig
        run: |
          count=$(git rev-list --count HEAD)
          echo "Commits im Checkout: $count"
          test "$count" -gt 1

      # Binärdatei statt Action, mit geprüfter Prüfsumme aus dem Release.
      # Dieselbe Fassung wie in ci.yml — beide zusammen aktualisieren.
      - name: gitleaks 8.30.1 holen
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Ausnahmen stehen einzeln in .gitleaksignore, begründet in docs/SECURITY.md.
      - name: Secret-Scan über alle Commits
        run: ./gitleaks git . --no-banner --redact --gitleaks-ignore-path .gitleaksignore

      # Ohne `bun install`: bun audit liest nur package.json und bun.lock. So
      # läuft kein fremder Installationscode in einem Job, der Issues schreiben
      # darf, und der Lauf bleibt kurz.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Befunde sammeln, nicht urteilen. Das Urteil fällt in ci.yml auf Push und
      # Pull Request (ab high). Hier entsteht eine Meldung, keine Farbe. Stufe
      # und Ausnahmen stehen in scripts/audit.sh. Der Exit-Code geht mit: Ohne
      # ihn sähe ein gescheiterter Audit aus wie ein sauberer.
      - name: Befunde sammeln, ab moderat
        run: |
          status=0
          bash scripts/audit.sh moderate > audit.txt 2>&1 || status=$?
          echo "$status" > audit-status.txt
          {
            echo '### bun audit, ab moderat, mit Ausnahmen'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Meldung als Issue, nur bei Änderung
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/sicherheits-meldung.sh audit.txt "$(cat audit-status.txt)"

      # Zur Ansicht in der Laufzusammenfassung, auch die ausgenommenen Nummern
      # und alles Niedrige. Färbt den Lauf nie.
      - name: Alle Befunde zur Ansicht
        if: always()
        run: |
          {
            echo '### bun audit, alle Stufen'
            echo ''
            echo '```'
            bun audit 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
