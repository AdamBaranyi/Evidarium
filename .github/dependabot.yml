# Updates laufen von selbst und melden sich, statt darauf zu warten, dass
# jemand nachschaut. Drei Regeln gelten überall in dieser Datei:
#
# 1. Keine Vorabversionen. Dependabot schlägt Beta, RC und Canary nur vor,
#    wenn die eingesetzte Fassung schon eine ist — hier ist das nirgends so.
# 2. Wartezeit (cooldown): sieben Tage nach der Veröffentlichung. Schützt vor
#    kaputten und vor gekaperten Neuversionen, bis andere sie bemerkt haben.
#    Gilt nur für diese geplanten Updates, nie für Security-Updates — die
#    kommen sofort.
# 3. "Funktioniert" heisst grün. Jeder dieser Pull Requests löst den vollen
#    CI-Lauf aus (Format, Dateilänge, Lint, Typen, Tests, Build, Secret-Scan,
#    Playwright, Produktionsaufbau). Gemergt wird nur, was grün ist.
#
# Meldung: `assignees` macht den Pull Request zu einer zugewiesenen Aufgabe —
# das ergibt eine E-Mail und einen Push in GitHub Mobile. `reviewers` gibt es
# seit dem 08.08.2025 nicht mehr.

version: 2

updates:
  # ---------------------------------------------------------------- Bun ----
  # Ein Lockfile im Wurzelverzeichnis. Voraussetzung ist das Textformat
  # bun.lock aus Bun ab 1.1.39, nicht das alte binäre bun.lockb.
  #
  # Achtung, Grenze: Der Dependency Graph von GitHub liest bun.lock nicht.
  # Für Bun gibt es hier also nur diese Versions-Updates und keine
  # Security-Updates. Den Alarm bei Schwachstellen liefert allein
  # .github/workflows/sicherheit-taeglich.yml mit `bun audit`.
  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - AdamBaranyi
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minor und Patch als ein einziger Sammel-PR: ein Lauf, eine Prüfung,
      # eine Entscheidung. Major-Sprünge kommen bewusst einzeln.
      alltag:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Die Typen von Node folgen der Laufzeit, nicht dem Neusten. Ein Sprung
      # auf eine Hauptversion, die hier gar nicht läuft, bringt nur Fehler.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 ist kein gewöhnliches Update, sondern der in Go neu
      # gebaute Compiler. Er bringt Tempo, keine Funktion und keine Sicherheit;
      # im Schwesterprojekt Tallyroom scheiterte der Typecheck damit
      # (dortiger Pull Request #4, geschlossen am 16.09.2026). Ohne diese
      # Sperre böte Dependabot jede Woche denselben roten Pull Request an, und
      # wer wöchentlich Rot wegklickt, klickt irgendwann das echte Rot weg.
      # Patches innerhalb von 6.x kommen weiter. Diese beiden Zeilen
      # entfernen, sobald der Sprung bewusst ansteht.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # ------------------------------------------------------ GitHub Actions ----
  # Hält actions/checkout, oven-sh/setup-bun und actions/upload-artifact
  # aktuell. Eine veraltete Action ist eine fremde Codeausführung in der CI.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - AdamBaranyi
    commit-message:
      prefix: ci

  # -------------------------------------------------------------- Docker ----
  # Die Images aus infra/docker-compose.yml, heute pgvector/pgvector.
  #
  # Das Ökosystem heisst `docker-compose`, nicht `docker`: `docker` liest
  # Dockerfiles, `docker-compose` liest Compose-Dateien. Mit `docker` auf
  # einem Verzeichnis ohne Dockerfile scheitert der Lauf (beobachtet
  # 17.09.2026, Lauf 35193707729). Ein Dockerfile gibt es hier noch nicht;
  # sobald eines dazukommt, bekommt es einen eigenen Eintrag.
  #
  # Ein Tag wie 0.8.6-pg18 wird vom Hersteller unter derselben Nummer neu
  # gebaut — Dependabot sieht nur Nummern und deckt das nie ab. Darum
  # zusätzlich die monatliche Erneuerung von Hand, siehe docs/BETRIEB.md.
  - package-ecosystem: docker-compose
    directory: '/infra'
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Zurich
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    assignees:
      - AdamBaranyi
    commit-message:
      prefix: build
