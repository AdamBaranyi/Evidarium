# Produktionsbetrieb auf vps1.
#
# Alle veröffentlichten Ports hängen an 127.0.0.1: Docker schreibt eigene
# iptables-Regeln und umgeht ufw. Erreichbar von aussen ist allein Caddy.
name: evidarium

services:
  db:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidarium_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: evidarium
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD fehlt}
    volumes:
      - db-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evidarium_owner -d evidarium']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: evidarium:${EVIDARIUM_VERSION:-lokal}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN fehlt}
      STORAGE_PATH: /app/storage
      WORKER_INTERN_URL: http://worker:3101
      TRUST_PROXY: 'true'
      AI_MODE: ${AI_MODE:-demo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-claude-haiku-4-5}
      BUDGET_MONAT_USD: ${BUDGET_MONAT_USD:-10}
      BUDGET_TAG_USD: ${BUDGET_TAG_USD:-2}
      FRAGEN_JE_SITZUNG: ${FRAGEN_JE_SITZUNG:-10}
      DEMO_AKTIV: ${DEMO_AKTIV:-false}
      DEMO_KONTO: ${DEMO_KONTO:-demo@nordstern.test}
      DEMO_FRAGEN_JE_HERKUNFT_TAG: ${DEMO_FRAGEN_JE_HERKUNFT_TAG:-30}
      BETREIBER_NAME: ${BETREIBER_NAME:?BETREIBER_NAME fehlt}
      BETREIBER_ADRESSE: ${BETREIBER_ADRESSE:?BETREIBER_ADRESSE fehlt}
      BETREIBER_EMAIL: ${BETREIBER_EMAIL:?BETREIBER_EMAIL fehlt}
    volumes:
      - storage:/app/storage
    ports:
      - '127.0.0.1:3100:3100'
    # Gesund heisst: Der Webprozess antwortet, und die Datenbank auch
    # (src/app/api/gesundheit). Node 24 bringt fetch mit; curl fehlt im Abbild.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/gesundheit').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: evidarium:${EVIDARIUM_VERSION:-lokal}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    command: ['bun', 'src/worker/index.ts']
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL fehlt}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET fehlt}
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN fehlt}
      STORAGE_PATH: /app/storage
      # Der interne Endpunkt. Web und Worker haben getrennte Netz-Namensräume;
      # mit der Vorgabe 127.0.0.1 erreichte die Weboberfläche ihn nicht
      # (ECONNREFUSED, gefunden am 18.09.2026 im ersten Produktionslauf).
      #
      # 0.0.0.0 heisst hier **nicht** «öffentlich»: Der Port wird nirgends
      # veröffentlicht, das Compose-Netz ist eigen, und Docker macht nur
      # veröffentlichte Ports nach aussen sichtbar.
      WORKER_INTERN_HOST: '0.0.0.0'
      WORKER_INTERN_PORT: '3101'
      # **Kein Schlüssel und kein AI_MODE hier.** Der Worker liest Dokumente
      # ein und rechnet Vektoren lokal; ein Modell ruft nur der Webprozess auf
      # (src/lib/antwort/anthropic-provider.ts). Was er nicht braucht, soll er
      # nicht kennen: So steht der Schlüssel in einem laufenden Prozess statt
      # in zweien. Ohne AI_MODE gilt die Vorgabe `demo`, und die
      # Konfigurationsprüfung verlangt dann keinen Schlüssel.
    volumes:
      - storage:/app/storage
      - modelle:/app/.modelle
    # Der interne Endpunkt antwortet erst, wenn das Modell geladen ist. Beim
    # allerersten Start lädt der Worker es herunter (rund 470 MB) — darum die
    # lange Anlaufzeit.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3101/gesundheit').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    # Der PDF-Parser kann bei grossen Dateien gegen 1 GB laufen; das Modell
    # belegt rund 1,5 GB. Ohne Grenze nimmt ein Ausreisser den ganzen Server
    # mit.
    mem_limit: 3g

volumes:
  db-data:
  storage:
  modelle:
